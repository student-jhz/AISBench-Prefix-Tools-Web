# 离线部署用 compose 模板(发布时 __VERSION__ 会被替换为实际版本号)
# 镜像由 deploy.sh 执行 docker load 预先导入, 无需联网构建
services:
  aisbench-web:
    image: aisbench-prefix-tools-web:__VERSION__
    container_name: aisbench-prefix-tools-web
    ports:
      - "8320:8320"
    volumes:
      # 上传文件与测试结果持久化到宿主机
      - ./data:/app/data
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机(连接宿主机上的 vLLM/SSH)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
