services:
  aisbench-web:
    build: .
    container_name: aisbench-prefix-tools-web
    ports:
      - "8320:8320"
    volumes:
      # 上传文件与测试结果持久化到宿主机
      - ./data:/app/data
    extra_hosts:
      # 容器内通过 host.docker.internal 访问宿主机(连接宿主机上的 vLLM/SSH)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
